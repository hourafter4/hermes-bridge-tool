name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: '3.12'
          version: '0.10.8'
      - run: uv sync --locked
      - run: sh tests/test_dependency_hashes.sh
      - run: uv run --locked python -m unittest discover -s tests -v
      - name: Check shell scripts
        run: |
          sh -n install.sh
          for script in scripts/*.sh tests/*.sh; do sh -n "$script"; done
          sh -n scripts/hermes-mcp
          sh -n scripts/setup-terminal.command
          sh tests/test_install.sh
          sh -n scripts/install-release.command
          sh tests/test_release_install.sh
      - name: Build and verify menu bar app
        if: runner.os == 'macOS'
        run: ./scripts/build-macos.sh
      - name: Build Python distribution
        run: uv build
