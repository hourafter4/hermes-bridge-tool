name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Verify tag and all package versions
        run: |
          uv run --locked python - <<'PY'
          import json, os, plistlib, tomllib
          from pathlib import Path
          from hermes_bridge_tool import __version__
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_TYPE'] == 'tag', 'Run this workflow on a version tag'
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match package version'
          assert __version__ == version
          for path in ('.codex-plugin/plugin.json', '.claude-plugin/plugin.json'):
              assert json.loads(Path(path).read_text())['version'] == version
          assert plistlib.loads(Path('macos/Info.plist').read_bytes())['CFBundleShortVersionString'] == version
          PY
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: sh tests/test_install.sh
      - run: sh tests/test_release_install.sh
      - name: Build universal macOS and CLI installation bundles
        run: ./scripts/package-release.sh
      - name: Generate download checksums
        run: |
          cd dist
          shasum -a 256 *.whl *.tar.gz *.zip > SHA256SUMS
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/hermes-release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("/tmp/hermes-release.json"))["isDraft"], "Refusing to replace a published release"'
            gh release upload "$RELEASE_TAG" --clobber dist/*.whl dist/*.tar.gz dist/*.zip dist/SHA256SUMS
            gh release edit "$RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Hermes Bridge Tool $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md dist/*.whl dist/*.tar.gz dist/*.zip dist/SHA256SUMS
          fi
