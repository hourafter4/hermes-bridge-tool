name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
          version: '0.10.8'
      - run: uv sync --locked
      - run: sh tests/test_dependency_hashes.sh
      - name: Verify tag and all package versions
        run: |
          uv run --locked python - <<'PY'
          import json, os, plistlib, tomllib
          from pathlib import Path
          from hermes_bridge_tool import __version__
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_TYPE'] == 'tag', 'Run this workflow on a version tag'
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match package version'
          assert __version__ == version
          for path in ('.codex-plugin/plugin.json', '.claude-plugin/plugin.json'):
              assert json.loads(Path(path).read_text())['version'] == version
          assert plistlib.loads(Path('macos/Info.plist').read_bytes())['CFBundleShortVersionString'] == version
          PY
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: sh tests/test_install.sh
      - run: sh tests/test_release_install.sh
      - name: Configure optional Apple signing credentials
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            test -z "$SIGNING_IDENTITY" || { echo 'Signing identity requires a certificate'; exit 1; }
            exit 0
          fi
          test -n "$SIGNING_IDENTITY"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/hermes-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/hermes-signing.keychain-db"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/hermes-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/hermes-signing.keychain-db"
          security import "$RUNNER_TEMP/hermes-signing.p12" -k "$RUNNER_TEMP/hermes-signing.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/hermes-signing.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/hermes-signing.keychain-db" login.keychain-db
          printf 'HERMES_SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID$APPLE_TEAM_ID$APPLE_APP_PASSWORD" ]; then
            test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID" && test -n "$APPLE_APP_PASSWORD"
            xcrun notarytool store-credentials hermes-release --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$RUNNER_TEMP/hermes-signing.keychain-db"
            echo 'HERMES_NOTARY_PROFILE=hermes-release' >> "$GITHUB_ENV"
          fi
      - name: Build universal macOS and CLI installation bundles
        run: ./scripts/package-release.sh
      - name: Generate download checksums
        run: |
          cd dist
          shasum -a 256 *.whl *.tar.gz *.zip > SHA256SUMS
      - name: Upload immutable build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
      - name: Remove Apple signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/hermes-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/hermes-signing.p12"

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Attest exact release downloads
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: 'dist/*'
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/hermes-release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("/tmp/hermes-release.json"))["isDraft"], "Refusing to replace a published release"'
            gh release upload "$RELEASE_TAG" --clobber dist/*.whl dist/*.tar.gz dist/*.zip dist/SHA256SUMS
            gh release edit "$RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Hermes Bridge Tool $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md dist/*.whl dist/*.tar.gz dist/*.zip dist/SHA256SUMS
          fi
