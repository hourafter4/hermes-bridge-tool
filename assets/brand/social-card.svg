      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAEFE7"/>
    </radialGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#2A9180"/>
      <stop offset="1" stop-color="#17675D"/>
    </linearGradient>
    <filter id="depth" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#235B48" flood-opacity=".18"/>
    </filter>
    <g id="app-icon">
  <rect width="1024" height="1024" rx="224" fill="url(#surface)"/>
  <rect x="120" y="120" width="784" height="784" rx="176" fill="none" stroke="#72B7A0" stroke-opacity=".6" stroke-width="15"/>
