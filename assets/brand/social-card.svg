    <text x="76" y="216" font-size="76" font-weight="600" letter-spacing="-3">Your agent.</text>
    <text x="76" y="298" font-size="76" font-weight="600" letter-spacing="-3">Within reach.</text>
    <text x="80" y="355" font-size="25" fill="#52645D">Bring your remote agent into your workflow.</text>
    <text x="80" y="394" font-size="19" fill="#52645D">A menu bar companion for Codex and Claude Code.</text>
