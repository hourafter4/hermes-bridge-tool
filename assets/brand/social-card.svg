<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 -16 1280 672" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Bridge Tool — Your agent. Within reach.</title>
  <desc id="desc">Bring your remote agent into your workflow. Codex and Claude Code connect through Hermes Bridge Tool to a remote Hermes agent over HTTPS or SSH.</desc>
