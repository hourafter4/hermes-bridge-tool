[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "hermes-bridge-tool"
version = "0.2.0"
description = "Connect coding agents to a remote Hermes agent over MCP and SSH."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1.28,<2", "httpx>=0.28,<1"]

[project.scripts]
hermes-bridge-tool = "hermes_bridge_tool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_bridge_tool"]

[dependency-groups]
dev = [
    "aiohttp>=3.10,<4",
]
